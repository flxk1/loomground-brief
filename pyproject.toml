[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-brief"
description = "What is the minimum a supervisor must read? A bounded selection over what the reasoning could not settle. Its size is a function of what went unresolved, not of how many actions were taken."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "Loomground Contributors" }]
# One narrow problem, one dependency — solver, whose own two language packs
# come with it. This package sits *above* the reasoning
# kernel: it uses the shared verdict, the OPEN-dominant fold and the injected
# ports, and reaches into no solver internals. It is imported by hosts, never by
# solver, versum or governance.
# Consumed from solver: decision.DecisionSpace, epistemic_status.{EpistemicStatus,
#   StatusedPremise,root_causes}. root_causes lands in 0.5.0 and exists in no
#   earlier release, so this floor is load-bearing rather than conventional.
# First-party siblings are direct git references, not ranges: no index serves this
# family. Each ref is the release tag loomground's RELEASES.json records, and the full
# transitive closure is declared, because those tagged commits still carry ranges that
# only these URLs can satisfy.
dependencies = [
    "loomground-solver @ git+https://github.com/flxk1/loomground-solver@solver-v0.6.0",
    "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@loomground-deontic-v0.2.1",
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@loomground-governance-v0.11.1",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/flxk1/loomground-brief"
Repository = "https://github.com/flxk1/loomground-brief"
Issues = "https://github.com/flxk1/loomground-brief/issues"

[tool.setuptools.dynamic]
version = { attr = "loomground_brief._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_brief*"]

[tool.setuptools.package-data]
loomground_brief = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
