[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-brief"
description = "What is the minimum a supervisor must read? A bounded selection over what the reasoning could not settle. Its size is a function of what went unresolved, not of how many actions were taken."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "Loomground Contributors" }]
# One narrow problem, one dependency. This package sits *above* the reasoning
# kernel: it uses the shared verdict, the OPEN-dominant fold and the injected
# ports, and reaches into no solver internals. It is imported by hosts, never by
# solver, versum or governance.
# Consumed from solver: decision.DecisionSpace, epistemic_status.{EpistemicStatus,
#   StatusedPremise,root_causes}. root_causes lands in 0.5.0 and exists in no
#   earlier release, so this floor is load-bearing rather than conventional.
dependencies = ["loomground-solver>=0.5,<0.6"]
dynamic = ["version"]

[project.optional-dependencies]
# Exact revisions CI resolves. The reasoning kernel this package sits above,
# plus the two language packs it depends on. This package needs `root_causes`,
# which lands in solver 0.5.0; the pin moves to that tag once it is cut.
# Pinned rather than ranged, because
# neither is published to an index yet and a range would resolve to nothing.
dev = [
  "loomground-governance @ git+https://github.com/flxk1/loomground-governance@9e91cf8d4b8624fbf017b7a96ec53c3ce366d31e",
  "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@6fc6df578a35be58924e8d3700fb992b24d68bbb",
  "loomground-solver @ git+https://github.com/flxk1/loomground-solver@c36866bad1dbb89848ee4551c171eb87d65f2f7d",
  "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/flxk1/loomground-brief"
Repository = "https://github.com/flxk1/loomground-brief"
Issues = "https://github.com/flxk1/loomground-brief/issues"

[tool.setuptools.dynamic]
version = { attr = "loomground_brief._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_brief*"]

[tool.setuptools.package-data]
loomground_brief = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
